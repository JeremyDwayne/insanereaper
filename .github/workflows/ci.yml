# Checks every pull request and push to main. A push to main that passes deploys to Cloudflare.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wrangler d1 migrations apply insanereaper --remote
      - run: pnpm build
      - name: Deploy with secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
        run: |
          node -e 'const {BETTER_AUTH_SECRET, POSTMARK_TOKEN} = process.env; require("fs").writeFileSync("secrets.json", JSON.stringify({BETTER_AUTH_SECRET, POSTMARK_TOKEN}))'
          pnpm wrangler deploy --secrets-file secrets.json
          rm secrets.json
